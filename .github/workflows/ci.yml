name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-audio:
    name: browser audio and call lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/voice_audio.test.mjs

  tests:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: preauth
          POSTGRES_PASSWORD: preauth
          POSTGRES_DB: preauth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preauth -d preauth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra postgres
      - name: Run tests
        env:
          PREAUTH_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://preauth:preauth@localhost:5432/preauth' || '' }}
        run: uv run pytest -q

  generated-files:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/export_api_docs.py --check
      - run: uv run python scripts/generate_uae_knowledge_base.py --check
      - run: uv run python scripts/assemblyai_setup.py --dry-run > /dev/null

  simulations:
    name: scripted call simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run the five call scenarios against a fresh database
        env:
          PREAUTH_DATABASE_URL: sqlite:///./simulation.db
        run: uv run python scripts/simulate_conversations.py --quiet

  local-mode:
    name: local mode starts without any paid credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `local` only: no model is downloaded, and the voice extras are not needed to prove the wiring.
      - run: uv sync --frozen --extra local
      # Deliberately unset throughout: all AssemblyAI keys, public URL and webhook/media secrets.
      - name: Migrate, seed and diagnose
        run: |
          uv run alembic upgrade head
          uv run python -m preauth.seed --scenarios
          # Ollama is not installed on the runner, so the report must fail on the model and nothing else.
          uv run python scripts/check_local.py || true
          uv run python scripts/check_local.py --json > report.json || true
          uv run python -c "$CHECK"
        env:
          PREAUTH_RUNTIME_MODE: local
          PREAUTH_DATABASE_URL: sqlite:///./local.db
          PREAUTH_LOCAL_STT_PROVIDER: none
          PREAUTH_LOCAL_TTS_PROVIDER: none
          CHECK: |
            import json
            report = json.load(open("report.json"))
            failed = {c["name"] for c in report["checks"] if c["status"] == "fail"}
            assert failed <= {"local LLM"}, f"unexpected failures: {failed}"
            assert all(c["fix"] for c in report["checks"] if c["status"] != "ok"), "a check failed without a fix"
            print("local mode is ready except for the model, as expected on a runner with no Ollama")

      - name: The service starts in local mode and serves the console
        env:
          PREAUTH_RUNTIME_MODE: local
          PREAUTH_DATABASE_URL: sqlite:///./local.db
        run: |
          uv run uvicorn preauth.main:app --port 8111 &
          for i in $(seq 1 30); do curl -sf localhost:8111/health && break; sleep 1; done
          curl -sf localhost:8111/local | grep -q "Sawt Assurance"
          curl -sf localhost:8111/api/v1/local/capabilities | grep -q '"model"'
          curl -sf localhost:8111/api/v1/local/conversations -X POST | grep -q '"conversation_id":"local_'

  docker:
    name: docker image starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t preauth:ci .
      - name: Start container and check health
        run: |
          docker run -d --name preauth-ci -p 7860:7860 \
            -e PREAUTH_DATABASE_URL=sqlite:////tmp/preauth.db \
            -e PREAUTH_VOICE_TOOL_TOKEN=ci-token \
            preauth:ci
          for i in $(seq 1 60); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf localhost:7860/health | grep -q '"ok"'
          docker rm -f preauth-ci
